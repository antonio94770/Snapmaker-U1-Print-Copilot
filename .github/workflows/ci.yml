name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows only: the project targets Snapmaker Orca on Windows. The runner
    # has no Snapmaker Orca, so the integration tests skip themselves.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel ships the HTML templates
        shell: bash
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("print_copilot/quality_report.html", "print_copilot/quality_viewer.html"):
              assert required in names, f"{required} missing from the wheel"
          print("wheel contents OK")
          EOF
