[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snapmaker-print-copilot"
version = "0.1.0"
description = "MCP server and CLI that prepares Snapmaker U1 prints with the Snapmaker Orca slicer"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.3,<3", "numpy>=1.26", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/antonio94770/Snapmaker-U1-Print-Copilot"
Documentation = "https://github.com/antonio94770/Snapmaker-U1-Print-Copilot/blob/main/docs/usage.md"
Issues = "https://github.com/antonio94770/Snapmaker-U1-Print-Copilot/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
print-copilot = "print_copilot.cli:main"
print-copilot-mcp = "print_copilot.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/print_copilot"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a local Snapmaker Orca install (skipped when absent)",
]
